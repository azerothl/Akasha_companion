; Akasha Companion — PlatformIO (Phase 6)
; Product env: fnk0104b. Experimental: fnk0104a. Stubs: fnk0104n / fnk0104s (#error until bring-up).

[platformio]
default_envs = fnk0104b

[common]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv
board_build.psram = enabled
monitor_filters = time
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.2.1
	adafruit/Adafruit NeoPixel@^1.12.3
	bodmer/TJpg_Decoder@^1.0.8
build_flags_common =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
	-Iboards
	-Iinclude
	-DUSER_SETUP_LOADED=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_ON=1
	-DTFT_MISO=13
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=46
	-DTFT_RST=-1
	-DTFT_BL=45
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=40000000
	-DUSE_HSPI_PORT=1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_GFXFF=1

; Pin Arduino-ESP32 2.x (IDF 4.4) — known-good ES8311 path for FNK0104B
[env:fnk0104b]
extends = common
build_flags =
	${common.build_flags_common}
	-DBOARD_FNK0104B=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320

; Experimental — same 2.8" panel family, no touch (UNVERIFIED hardware)
[env:fnk0104a]
extends = common
build_flags =
	${common.build_flags_common}
	-DBOARD_FNK0104A=1
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320

; Stub envs — board headers #error until pins filled (do not treat as product)
[env:fnk0104n]
extends = common
build_flags =
	${common.build_flags_common}
	-DBOARD_FNK0104N=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480

[env:fnk0104s]
extends = common
build_flags =
	${common.build_flags_common}
	-DBOARD_FNK0104S=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
